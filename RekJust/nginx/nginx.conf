events {
    worker_connections 1024;
}

http {
    # Upstream – logiczna nazwa grupy serwerów za proxy.
    # "prompt-api:8080" to DNS w sieci Docker Compose.
    upstream prompt_api {
        server prompt-api:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        # Wszystkie żądania /api/* idą do PromptApi
        # proxy_pass przekazuje żądanie do upstream bez ujawniania wewnętrznego portu
        location /api/ {
            proxy_pass         http://prompt_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Wyłączamy buforowanie dla API – chcemy natychmiastowe odpowiedzi
            proxy_buffering    off;
        }

        # Wszystko inne idzie do frontendu Next.js
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;

            # WebSocket support – potrzebny dla Next.js HMR w trybie dev
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
