services:

  # ── INFRASTRUKTURA ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rekjust
      POSTGRES_USER: rekjust
      POSTGRES_PASSWORD: rekjust123
    volumes:
      - postgres_data:/var/lib/postgresql/data   # dane przeżywają restart kontenera
    ports:
      - "5432:5432"   # dostęp z hosta do inspekcji (np. przez DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekjust"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rekjust-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rekjust
      RABBITMQ_DEFAULT_PASS: rekjust123
    ports:
      - "5672:5672"     # AMQP – protokół kolejki
      - "15672:15672"   # Management UI – http://localhost:15672 (user: rekjust)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rekjust-net

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama   # pobrane modele przeżywają restart
    ports:
      - "11434:11434"
    networks:
      - rekjust-net

  # ── APLIKACJE ───────────────────────────────────────────────────────────────

  prompt-api:
    build:
      context: .             # kontekst = katalog główny (zawiera Contracts/)
      dockerfile: PromptApi/Dockerfile
    environment:
      # Zmienne środowiskowe nadpisują appsettings.json
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=rekjust;Username=rekjust;Password=rekjust123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: rekjust
      RabbitMQ__Password: rekjust123
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy    # czeka na health check – bez tego API padnie próbując połączyć się z DB
      rabbitmq:
        condition: service_healthy
    networks:
      - rekjust-net

  worker-service:
    build:
      context: .
      dockerfile: WorkerService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=rekjust;Username=rekjust;Password=rekjust123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: rekjust
      RabbitMQ__Password: rekjust123
      Ollama__Endpoint: http://ollama:11434
      Ollama__Model: llama3.2
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rekjust-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - rekjust-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"    # jedyny port otwarty na świat
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # :ro = read-only
    depends_on:
      - prompt-api
      - frontend
    networks:
      - rekjust-net

# ── WOLUMENY ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  ollama_data:

# ── SIECI ─────────────────────────────────────────────────────────────────────
networks:
  rekjust-net:
    driver: bridge   # sieć mostowa – serwisy komunikują się po nazwach
